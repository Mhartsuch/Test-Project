name: Build Forge APK

on:
  push:
    branches: [ main, 'claude/**' ]
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same ref supersedes an in-flight build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain --stacktrace --info assembleRelease

      - name: Read version
        id: ver
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "Forge-$V.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Forge-${{ steps.ver.outputs.version }}
          path: Forge-${{ steps.ver.outputs.version }}.apk

      - name: Publish release (Forge downloads updates from here)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-b${{ github.run_number }}
          name: Forge ${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
          body: ${{ github.event.head_commit.message }}
          files: Forge-${{ steps.ver.outputs.version }}.apk
